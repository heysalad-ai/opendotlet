</g>
<g font-size="24" font-weight="700">
<text x="76" y="197">Press a dotlet</text><text x="414" y="197">Open.Dotlet service</text><text x="784" y="197">Codex</text><text x="1129" y="197">See the result</text>
</g>
<g font-size="19">
<text x="76" y="239">One physical key</text><text x="76" y="272">USB · fresh press</text>
<text x="414" y="239">Saved task + project</text><text x="414" y="272">One run at a time</text>
<text x="784" y="239">Existing sign-in</text><text x="784" y="272">Read-only project</text>
<text x="1129" y="239">Agent team view</text><text x="1129" y="272">Progress + history</text>
</g>
