<g font-family="Arial,Helvetica,sans-serif" fill="#111312">
<text x="52" y="68" font-size="34" font-weight="700">A little dotlet. A useful task.</text>
<text x="52" y="103" font-size="19" fill="#5d655f">Saved read-only task flow · physical press or on-screen Run task</text>
<g stroke="#111312" stroke-width="2">
<rect x="52" y="150" width="240" height="170" rx="14" fill="#a4d866"/>
<rect x="390" y="150" width="270" height="170" rx="14" fill="#ffffff"/>
