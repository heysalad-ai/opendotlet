<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
<title id="title">Open.Dotlet: one key, one saved Codex task</title><desc id="desc">A physical key press travels over USB to the local Open.Dotlet service, which runs a saved read-only Codex task. The result returns to the Agent team view. The public alpha provides native Mac and local Windows browser interfaces; additional developer adapters are experimental.</desc>
