<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDotlet · Mobile · Huddle (concept)</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono&amp;family=Nunito:wght@800;900&amp;display=swap" rel="stylesheet">
<style>

body{margin:0}
*{box-sizing:border-box}
.od{--coral:#ff5c39;--ink:#14110f;--paper:#fbf7f0;--surface:#ffffff;--backing:#e9e3d6;--muted:#6f6a63;--hair:#d9d2c3;
 --listen:#1f6fd1;--think:#6a3de8;--approve:#a35f00;--done:#1b7f49;--error:#c4281a;
 font-family:Inter,system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:22px}
.od.dark{--ink:#fbf7f0;--paper:#14110f;--surface:#1f1a17;--backing:#2a2522;--muted:#b5ada3;--hair:#3a3430;
 --listen:#6cb4ff;--think:#b79cff;--approve:#ffb547;--done:#4fd18b;--error:#ff7a6b}
.disp{font-family:Nunito,ui-rounded,sans-serif;font-weight:900;letter-spacing:-0.01em}
.h2{font-family:Nunito,ui-rounded,sans-serif;font-weight:800;font-size:20px;line-height:26px;margin:0}
.lbl{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px/20px Inter,sans-serif;padding:10px 18px;border:2px solid #14110f;border-radius:14px;background:#ff5c39;color:#14110f;box-shadow:3px 3px 0 0 #14110f;cursor:pointer;white-space:nowrap}
.dark .btn{box-shadow:3px 3px 0 0 #000}
.btn2{display:inline-flex;align-items:center;gap:8px;font:600 14px/20px Inter,sans-serif;padding:10px 18px;border:2px solid var(--ink);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn-s{padding:6px 12px;font-size:13px;border-radius:12px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border:2px solid var(--ink);border-radius:999px;background:var(--surface);font-size:12px;font-weight:600;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:20px;box-shadow:3px 3px 0 0 #14110f}
.dark .card{box-shadow:3px 3px 0 0 #000}
.av{position:relative;display:inline-block;flex:none}
.av img{display:block;width:100%;height:100%}
.badge{position:absolute;right:-2px;bottom:-2px;width:40%;height:40%;min-width:14px;min-height:14px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.badge svg{width:70%;height:70%}
.speak{outline:4px solid #ff5c39;outline-offset:4px;border-radius:50%}
.concept{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--backing);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:18px}
.bars i{display:block;width:4px;border-radius:2px;background:#ff5c39}


</style>

</head>
<body>
<div class="od dark" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #14110f; display: flex; flex-direction: column; align-items: center; padding: 28px 22px 30px">
<header style="width: 100%; display: flex; align-items: center; justify-content: space-between">
<span class="chip" style="background: #c4281a; color: #fbf7f0; border-color: #c4281a"><span class="dot" style="background: #fbf7f0"></span>12:41</span>
<b style="font-size: 14px">#launch-week</b><span class="concept" style="background: #2a2522; color: #b5ada3">Concept</span></header>
<div style="margin-top: 40px"><span class="av speak" style="width: 180px; height: 180px"><img src="../assets/dotlet-coral.svg" alt="Kofi"></span></div>
<p class="disp" style="margin: 26px 0 0; font-size: 34px; line-height: 38px">Kofi</p>
<p style="margin: 6px 0 0; display: flex; gap: 8px; align-items: center"><span class="bars" aria-hidden="true"><i style="height: 6px"></i><i style="height: 12px"></i><i style="height: 18px"></i><i style="height: 10px"></i><i style="height: 16px"></i><i style="height: 8px"></i><i style="height: 13px"></i></span><b>Speaking</b><span class="muted">· Lead</span></p>
<p style="margin: 22px 0 0; padding: 12px 14px; border-radius: 16px; background: #2a2522; font-size: 14px; line-height: 20px; width: 100%">"Yes, if the parts land Wednesday. Mira, can you give us the supplier numbers?"</p>
<ul style="list-style: none; margin: 26px 0 0; padding: 0; display: flex; gap: 26px"><li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><span class="av" style="width: 56px; height: 56px"><img src="../assets/dotlet-sky.svg" alt="Mira"></span>Mira<span style="color: var(--approve)">hand up</span></li><li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><span class="av" style="width: 56px; height: 56px"><img src="../assets/dotlet-sun.svg" alt="Sol"><span class="badge"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="5.5" width="2.4" height="5" rx="1.2" fill="var(--listen)"/><rect x="6.8" y="3" width="2.4" height="10" rx="1.2" fill="var(--listen)"/><rect x="11.1" y="4.5" width="2.4" height="7" rx="1.2" fill="var(--listen)"/></svg></span></span>Sol</li><li style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600"><span class="av" style="width: 56px; height: 56px"><img src="../assets/dotlet-lilac.svg" alt="Pip"><span class="badge"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="var(--ink)" stroke-opacity=".25" stroke-width="2.4"/><path d="M8 2.5A5.5 5.5 0 0 1 13.5 8" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/></svg></span></span>Pip</li></ul>
<nav aria-label="Call controls" style="margin-top: auto; width: 100%; display: flex; justify-content: space-between; align-items: center">
<button class="ibtn" style="width: 60px; height: 60px" aria-label="Mute"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button class="ibtn" style="width: 60px; height: 60px" aria-label="Interrupt"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.6-2.2L3 15.5a1.6 1.6 0 0 1 2.4-2L8 16"/></svg></button>
<button class="ibtn" style="width: 60px; height: 60px" aria-label="Pass the mic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<button class="ibtn" style="width: 60px; height: 60px" aria-label="Transcript"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 10.5a2 2 0 1 0 0 3M16 10.5a2 2 0 1 0 0 3"/></svg></button>
<button class="ibtn" style="width: 60px; height: 60px; background: #c4281a; border-color: #c4281a; color: #fbf7f0" aria-label="End huddle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15c5-5 13-5 18 0l-2.5 2.5-3.5-1.5v-3a10 10 0 0 0-6 0v3L5.5 17.5z"/></svg></button></nav></div>
</body>
</html>
