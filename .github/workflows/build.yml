name: Build firmware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 4'
      timezone: Europe/London
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bootstrap, validate and build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python -m pip install -r requirements.txt
          python tools/bootstrap.py
          python -m unittest discover -s tests -v
          python tools/pack_assets.py --theme black
          python tools/validate_assets.py
          idf.py set-target esp32s3
          idf.py build

  mg24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: '1.5.1'
      - name: Install pinned Silicon Labs core
        run: |
          arduino-cli core update-index --additional-urls https://siliconlabs.github.io/arduino/package_arduinosilabs_index.json
          arduino-cli core install SiliconLabs:silabs@4.0.0 --additional-urls https://siliconlabs.github.io/arduino/package_arduinosilabs_index.json
      - name: Compile MG24 BLE microphone
        run: bash tools/build-mg24.sh
